name: Publish
on:
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: write
  issues: write
  pull-requests: write  

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup git repo
        run: |
          git config user.name $GITHUB_ACTOR
          git config user.email gh-actions-${GITHUB_ACTOR}@github.com
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Resolve version to publish
        id: version
        run: |
          version=$(npm pkg get version | tr -d '"')
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag-name=v${version}" >> $GITHUB_OUTPUT
      - name: Verify the release tag does not already exist
        env:
          TAG_NAME: ${{ steps.version.outputs.tag-name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG_NAME} already exists. Bump the version in package.json first."
            exit 1
          fi
      - run: npm install
      - run: npm run build
      - run: npm run test
      - name: Publish to npm
        run: npm publish
      - name: Tag the release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag-name }}
        run: |
          git tag -a "${TAG_NAME}" -m "Version ${VERSION}"
          git push origin "${TAG_NAME}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: npm-logs
          path: ~/.npm/_logs
      - name: Create a Release
        id: create-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag-name }}
          generate_release_notes: true
      - name: Comment on PRs with link to release they are included in
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.create-release.outputs.id }}
        with:
          script: |
            const releaseId = process.env.RELEASE_ID;
            console.log(`Fetching release_id: ${releaseId} ...`);
            const getReleaseResponse = await github.rest.repos.getRelease({
              release_id: process.env.RELEASE_ID,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const release = getReleaseResponse.data;

            const prNumbersInRelease = new Set(Array.from(release.body.matchAll(/\/pull\/(\d+)/g)).map(p=>p[1]));

            for(let prNumber of prNumbersInRelease) {
              console.log(`Adding comment on PR #${prNumber} ...`);
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `The changes in this PR were just released in [${release.name}](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${release.tag_name}) 🎉.`
              })
            }
